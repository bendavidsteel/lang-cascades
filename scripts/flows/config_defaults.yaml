# Keys the nested-split training path requires.
#
# config/ is gitignored, so these live here to stay under version control;
# paste them into config/config.yaml on each machine.

n_dims: 6
num_epochs: 100
patience: 10

# Everything a run produces: the latent fit, and the landscape models trained
# on it in a directory each. Derived from the config, so a configuration is
# addressable without a record of where it was written.
out_dir: './out'

# Nested trajectory x time split. Trajectories are hashed into train/val/test;
# a pair is out-of-time when its target t1 lands in the last holdout_days.
# origin_offset_days > 0 moves the window back from the end of the data and
# discards everything after it -- one fold of a rolling holdout. See
# rolling_holdout.py; a single run leaves it at 0.
split:
  holdout_days: 365
  origin_offset_days: 0
  train_frac: 0.70
  val_frac: 0.10
  seed: 42

# Latent trajectories. 'gpfa' fits the latent-GP factor model inside the split
# boundary, so held-out trajectories never reach the representation; 'ppca'
# reads coords precomputed over everything and cannot make that guarantee.
latents:
  method: gpfa
  cells_path: 'tmp/gpfa_cells_2022_onwards.parquet.zstd'
  bin_factor: 8                  # latent grid spacing = 2 * bin_factor days
  interp_days: 2.0               # resample onto this spacing; 0 keeps the bin grid
  n_fast: 2                      # dimensions with drifting dynamics; the rest are slow
  fast_tau: 80.0
  fast_kind: wiener              # wiener (diffusing) or ou (confined)
  slow_kind: const               # const (frozen), wiener or ou
  slow_tau: 2560.0
  rho: 0.0                       # within-cell overdispersion; 0 = iid per post
  iters: 25
  infer_iters: 15
  causal_state: false            # true = filtered state, which cannot see its own future
  seed: 0

  # Seeds every trial is fitted and scored on, from scripts/flows/pin_seeds.py.
  # Empty falls back to the posterior-sd rule, which varies with n_fast and
  # n_dims and so lets a configuration choose the population it is graded on.
  seed_path: ''

  # How much of the stance classifier's output the fit sees. 'hard' is its
  # label; 'soft' its probabilities as expected counts; 'channel' its label
  # through a confusion matrix measured on coded pairs.
  obs_model: hard                # hard | channel | soft
  obs_temperature: 1.0           # >1 flattens an overconfident posterior
  prob_resolution: 6             # simplex lattice spacing is 1/resolution
  prob_floor: 0.01               # uniform mass mixed into each lattice point
  calibration_path: ''           # latent_gp.calibrate output; 'channel' needs it

  # Gaussian prior precision on the per-target loadings. m_step solves a
  # weighted least squares per target, so a target the data barely constrains
  # gets as large a loading as one that carries a dimension; this shrinks each
  # by A_j / (A_j + w_ridge) against the site precision A_j the target
  # actually accumulates, which the fit logs. 1e-4 is the old singularity
  # guard, far below any A_j, and leaves the loadings unregularised.
  w_ridge: 1e-4

  # Rank a dimension's targets by |loading| * sqrt(volume) rather than
  # |loading|. Pairs with w_ridge: on at w_ridge's default, where the raw
  # ranking is dominated by targets the fit barely constrains; off if w_ridge
  # is ever turned up, or every dimension is topped by the same few
  # highest-volume targets. Changes only how the axes are read, never the fit.
  rank_by_volume: true

# Skill, not MSE: a smoother latent lowers model and baseline error together,
# so optimising MSE would select for smoothing the latent into a constant.
#
# Scored at a horizon rather than one step: on a 2-day grid the latent barely
# moves between consecutive points, so 1-step skill is measured where there is
# almost no motion to predict. The horizon has to be fixed across the sweep,
# not matched to each trial's own timescale.
# ceiling_gain is the variance of the observed motion that the landscape
# explains beyond a momentum rule -- predict the reverse of recent motion,
# which reaches |rho| ~ 0.25 on these latents by itself. skill_ceiling alone
# would reward a model for rediscovering that, and skill alone is worse still:
# it goes to zero as the drift does, whatever the model has learned, so it
# cannot tell a collapsed configuration from a merely unhelpful one.
objective_prefix: horizon_90d
objective_scenario: val_out
objective_metric: ceiling_gain
breakdown_scenario: null       # per-dimension/type breakdowns; off for sweeps
eval_horizons: [30, 90, 180]

# Scoring a scenario cell in full takes hours once the drift field is
# non-trivial, and cost grows sublinearly in batch size, so each cell is capped
# and scored in one batch. Set eval_max_pairs to 0 to score every pair.
eval_max_pairs: 5000

# stationarity.py. Read through cfg.get(defaults), so a machine whose
# config/config.yaml has not caught up still runs without them.
max_posterior_sd: 0.8        # drop seeds whose state is mostly prior, not data
min_seed_posts: 1200         # pin_seeds.py floor; sd is high where posts are few
stationarity_boot: 199       # bootstrap replicates for the panel nulls
stationarity_windows: 6      # time windows for the mean/variance drift test
