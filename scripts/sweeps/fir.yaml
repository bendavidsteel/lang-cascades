# Sweep for Fir, where a job is two hours on one H100.
#
# Same search as joint.yaml, restricted to the configurations that finish well
# inside a two-hour allocation.
#
# The runtime restriction is not a compromise about what is worth
# exploring: runtime on these trials is driven entirely by the
# structural settings, and every continuous parameter is flat against it
# (|r| < 0.17 over 44 trials). Dropping the expensive end of four discrete axes
# therefore buys a large speedup at a known cost in coverage, and prometheus
# keeps the expensive end.
#
# Measured means from that sweep, which is where the cuts come from:
#   phi_hidden_dims  [64,64,64] 0.75h   [128x4] 1.32h   [256,256,256] 1.83h
#   obs_model        hard 0.90h   channel 1.14h   soft 1.04h
#   bin_factor       8 0.85h   4 1.48h   2 1.57h
#
# bin_factor is the cut that costs least: every one of the ten best trials used
# 8, the largest value the old grid offered, so the winning region is already
# the cheap one on that axis.
#
#   wandb sweep --project potential_landscape_training scripts/sweeps/fir.yaml
#   sbatch --export=SWEEP=<entity/project/id>,COUNT=6 gpfa_agent.sh
#
# The per-trial timeout sits below the two-hour wall so a slow trial is killed
# inside the job, by the job, rather than by SLURM mid-step: a trial SIGKILLed
# by the scheduler is charged to the allocation and recorded as crashed.

program: scripts/flows/nn_potential.py
method: bayes
metric:
  name: objective
  goal: maximize

# Without this the search never ends: five parameters are continuous, so the
# space cannot be exhausted the way a grid can. How long 200 takes here depends
# on the queue rather than the trials.
run_cap: 200

command:
  - ${env}
  - timeout                     # a stalled trial must not block its agent
  # A trial SIGKILLed by SLURM is charged to the allocation and recorded as
  # crashed, whereas one killed by this is only recorded. Landscape training is
  # minutes now, so the budget is set by the latent fit a cache miss pays for,
  # and the slack is only ever paid by the trials that need it.
  - "3000"
  - python
  - ${program}
  - ${args_no_hyphens}

parameters:
  # --- fixed for every trial ---
  # Only the objective horizon is scored: integrating the SDE over 90 days
  # costs about ten times a single step, so extra horizons are for final runs.
  # num_epochs also sets the learning-rate decay horizon, so this is a change
  # to the optimisation and not only a cap; trials from earlier sweeps, which
  # decayed over 400 epochs, are not comparable. Every trial that finished
  # early-stopped well inside 100.
  num_epochs:
    value: 100
  patience:
    value: 10
  # 96 rather than 90: rows sit on the bin grid, so build_horizon_pairs shifts
  # by round(horizon / (2 * bin_factor)) rows and 90 days lands on 96 anyway.
  # Naming it 96 keeps the label and the measurement the same number.
  eval_horizons:
    value: "[96]"
  objective_prefix:
    value: horizon_96d
  breakdown_scenario:
    value: "null"
  # The landscape is fitted to displacements of whichever state this selects, so
  # a smoothed one puts the smoother's lookahead into the drift field and not
  # only into the score. Not an axis: only the filtered state can carry a
  # forecast claim, and trials across the two are not comparable.
  latents.causal_state:
    value: true

  # Constant-step Euler-Maruyama. 'heun' is the only solver wired to an
  # adaptive controller, and a rejected step there is not bounded by dtmin the
  # way an accepted one is: with throw=False a stiffening field silently burns
  # max_steps per pair, which is minutes rather than milliseconds. Step size
  # comes from dt, capped at a quarter of the pair's span.
  solver:
    value: euler

  # Every trial is fitted and scored on this one population. The posterior-sd
  # rule it replaces keys off the fast block, so n_fast and n_dims chose the
  # seeds a trial was graded on, and the objective tracked that choice more
  # closely than it tracked any modelling axis. Written by
  # scripts/flows/pin_seeds.py.
  latents.seed_path:
    value: tmp/eval_seeds.parquet.zstd

  # Rows between bin centres are forecast forward from the last one under
  # causal_state, so they carry no observation of their own. Resampling would
  # make seven of every eight one-step displacements the prior's decay.
  latents.interp_days:
    value: 0


  # --- stance observation model ---
  # How much of the classifier's output the latent fit sees. On the GPFA's own
  # held-out blocks a frozen latent beats a drifting prior under every value
  # offered here, so the drift the landscape model exists to predict may not be
  # identifiable from labels at all. Swept here so the held-out objective
  # decides, but note a bayes sweep cannot give clean marginals: settle it with
  # a paired rerun of the winning configuration under each value, everything
  # else fixed.
  #
  # 'channel' reads the finetune's own 16,972-example test confusion matrix,
  # written beside the checkpoint; latent_gp.calibrate turns it into the file
  # below. It needs three lattice points rather than 28, so it is much the
  # cheapest of the three that model classifier error.
  latents.obs_model:
    values: [hard, channel, soft]
  latents.calibration_path:
    value: tmp/stance_calibration.json
  # Temperature is only read by soft, and the cache key knows that, so hard and
  # channel trials still share a latent fit across its values.
  #
  # A calibrated classifier's mean confidence equals its accuracy. On the corpus
  # the mean is 0.776 against the test split's 0.740 accuracy, so the classifier
  # is overconfident and only T > 1 is in play; matching the two implies T=1.33,
  # and the per-benchmark accuracy spread (0.66 to 0.85) brackets it to 1.8ish
  # before the hardest benchmark takes over.
  #
  # Discrete, like the other GPFA parameters and for the same reason: drawn from
  # a continuous range every soft trial is its own cache key and pays for a
  # full latent fit, and at this scale that is most of the trial budget.
  #
  # The range extends past what calibration implies because the data asked it
  # to: across 42 trials every one of the top ten sat at 1.8, which was the
  # largest value on offer, so the optimum was outside the grid rather than in
  # it. 3.4 is the top of the bracket the per-benchmark accuracy spread allows.
  latents.obs_temperature:
    values: [1.0, 1.33, 1.8, 2.5, 3.4]

  # --- latent-GP factor model ---
  # fast_tau is the one axis that has settled inside its range: 20 took five of
  # the top ten and 10, 40 and 80 all appear, so it is left alone.
  #
  # n_fast is unsettled. 1, 2 and 3 are indistinguishable on the current data
  # and only 6 is clearly worse, so the range stays wide rather than narrowing
  # toward the floor; n_fast=0 is not on it because it freezes the latent and
  # takes rho to 0.03. A bayes search allocates trials endogenously, so its
  # marginals here are not clean -- settle the axis with a paired rerun.
  #
  # The objective cannot compare across n_fast on its own: pooled rho weights a
  # dimension by its share of displacement variance, so motion concentrated in
  # one axis is scored on a different problem. ceiling_gain_per_dim removes the
  # weighting but collapses onto the pooled value when only one axis moves, so
  # read spurious_drift_ratio and baseline_mse beside both.
  #
  # Fixed at wiener. A reverting prior writes its own reversion into the state
  # between observations, and the objective scores against a momentum rule that
  # cannot predict reversion, so a landscape that learns nothing but the prior
  # still beats the baseline. Given ou the search took it: the top ten trials
  # of one sweep all paired it with the fastest tau and a single drifting
  # dimension, for drift fields 96-99% reproduced by one linear map.
  #
  # n_fast=6 is >= every n_dims offered, which is how a homogeneous mix is
  # reached: the winning prior was homogeneous, and a per-dimension mix cannot
  # express it.
  n_dims:
    values: [3, 4, 5, 6]
  latents.n_fast:
    values: [1, 2, 3, 4, 6]
  latents.fast_kind:
    value: wiener
  latents.fast_tau:
    values: [10.0, 20.0, 40.0, 80.0]
  # Confining the slow dimensions turned out to matter more than whether they
  # drift at all: holding a 1fast+5slow mix fixed and changing only the slow
  # kind, const -> wiener -> ou took forecast RPS 0.2830 -> 0.2822 -> 0.2734.
  #
  # slow_tau has to come with it. An OU reverts over 2*tau, so at 2560 alone it
  # would not revert once inside the span of the data and the option would be a
  # null test; 640 is where the gain above was measured.
  latents.slow_kind:
    values: [const, wiener]
  latents.slow_tau:
    values: [640.0, 2560.0]
  # Fixed, not swept. The grid spacing is 2 * bin_factor days and the fast
  # prior's one-step correlation is exp(-dt / (2 * fast_tau)), so a coarser
  # grid leaves adjacent bins nearly independent under the prior and the state
  # between them is prior rather than measurement. 8 holds that above 0.45 at
  # every fast_tau offered; 16 takes it to 0.20 at the short end. The values
  # below 8 multiply the cells for a value that has never placed.
  latents.bin_factor:
    value: 8
  # See joint.yaml. Kept to the three values that bracket the measured decline,
  # since this sweep pays for a latent fit per value on top of a narrower grid.
  latents.w_ridge:
    values: [0.0001, 1.0, 10.0]

  # --- landscape model ---
  # sigma above ~0.7 and lr above ~0.02 drove the drift field to zero inside
  # one epoch in the first sweep; both ranges stop short of that.
  sigma:
    distribution: log_uniform_values
    min: 0.02
    max: 0.4
  confinement_factor:
    distribution: log_uniform_values
    min: 1e-4
    max: 1e-1
  learning_rate:
    distribution: log_uniform_values
    min: 1e-4
    max: 1e-2
  weight_decay:
    distribution: log_uniform_values
    min: 1e-4
    max: 1e-1
  phi_layer_dropout:
    distribution: uniform
    min: 0.0
    max: 0.2
  phi_hidden_dims:
    values: ["[64,64,64]", "[128,128,128,128]"]
  # Fixed, not swept. Across 250 finished trials the objective is monotone in
  # it and every one of the top fifteen sat at 1024, well past what the search's
  # own allocation to that value would produce. It is also the cheapest: the
  # card is not saturated below it, so a smaller batch costs nearly as much per
  # step while taking more of them.
  batch_size:
    value: 1024
