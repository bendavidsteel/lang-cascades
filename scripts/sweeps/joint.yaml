# Joint sweep over the latent-GP factor model and the landscape model.
#
# Both are fitted in one process, so the representation is re-fitted inside the
# split boundary for every trial and held-out trajectories never reach it.
#
# The objective is ceiling_gain on val_out (unseen trajectory, unseen time):
# the share of observed displacement variance the landscape explains beyond a
# momentum rule. MSE is out because a smoother latent lowers model and baseline
# error together, so it would drive the latent toward a constant and reward
# itself for it. Plain skill is out because it vanishes as the drift does, and
# cannot tell a collapsed configuration from a merely unhelpful one.
# skill_ceiling = rho^2 is out because the momentum one-liner reaches
# |rho| ~ 0.25 on these latents unaided, so a model can score well on it by
# rediscovering momentum.
#
# GPFA parameters are discrete so that trials sharing a latent configuration
# hit the on-disk cache and only pay for landscape training.
#
#   wandb sweep --project potential_landscape_training scripts/sweeps/joint.yaml
#   PATH=scripts/flows/.venv/bin:$PATH wandb agent <entity>/<project>/<sweep_id>
#
# Run ONE agent, on ONE card, leaving the other free. Two on a card split its
# throughput rather than adding to it -- measured 203W with two trials against
# 215W with one -- so each runs at about half speed, and against a per-trial
# wall-clock budget that turns healthy trials into killed ones.
#
# Run scripts/sweeps/watchdog.sh alongside them. Some configurations drive the
# solver into batches that take minutes each; one such trial ran five and a
# half hours without finishing an epoch and blocked its agent the whole time.
#
# The agent runs `python` through /usr/bin/env, which does not inherit the
# venv unless it is on PATH -- without that every trial dies before it starts.

program: scripts/flows/nn_potential.py
method: bayes
metric:
  name: objective
  goal: maximize

# Without this the search never ends: five parameters are continuous, so the
# space cannot be exhausted the way a grid can. One card turns over about 19
# trials a day, so this is a bit under a week.
run_cap: 120

command:
  - ${env}
  - timeout                     # a stalled trial must not block its agent
  # The rebuilt aggregate has half again as many pairs, so an epoch now runs
  # ~70s at batch_size 512 and about twice that at 256, and the latent fit
  # costs 12-20 min depending on the grid. A hundred epochs at the small batch
  # size therefore lands past 10800s, and a budget under the trial kills
  # healthy trials rather than stalled ones -- which is what cost the first
  # sweep two thirds of its yield. patience keeps the typical trial far inside
  # this, so the slack is only ever paid by the trials that need it.
  - "14400"
  - python
  - ${program}
  - ${args_no_hyphens}

parameters:
  # --- fixed for every trial ---
  # Only the objective horizon is scored: integrating the SDE over 90 days
  # costs about ten times a single step, so extra horizons are for final runs.
  # num_epochs also sets the learning-rate decay horizon, so this is a change
  # to the optimisation and not only a cap; trials from earlier sweeps, which
  # decayed over 400 epochs, are not comparable. Every trial that finished
  # early-stopped well inside 100.
  num_epochs:
    value: 100
  patience:
    value: 10
  eval_horizons:
    value: "[90]"
  breakdown_scenario:
    value: "null"
  # The landscape is fitted to displacements of whichever state this selects, so
  # a smoothed one puts the smoother's lookahead into the drift field and not
  # only into the score. Not an axis: only the filtered state can carry a
  # forecast claim, and trials across the two are not comparable.
  latents.causal_state:
    value: true


  # --- stance observation model ---
  # How much of the classifier's output the latent fit sees. On the GPFA's own
  # held-out blocks a frozen latent beats a drifting prior under every value
  # offered here, so the drift the landscape model exists to predict may not be
  # identifiable from labels at all. Swept here so the held-out objective
  # decides, but note a bayes sweep cannot give clean marginals: settle it with
  # a paired rerun of the winning configuration under each value, everything
  # else fixed.
  #
  # 'channel' reads the finetune's own 16,972-example test confusion matrix,
  # written beside the checkpoint; latent_gp.calibrate turns it into the file
  # below. It needs three lattice points rather than 28, so it is much the
  # cheapest of the three that model classifier error.
  latents.obs_model:
    values: [hard, channel, soft]
  latents.calibration_path:
    value: tmp/stance_calibration.json
  # Temperature is only read by soft, and the cache key knows that, so hard and
  # channel trials still share a latent fit across its values.
  #
  # A calibrated classifier's mean confidence equals its accuracy. On the corpus
  # the mean is 0.776 against the test split's 0.740 accuracy, so the classifier
  # is overconfident and only T > 1 is in play; matching the two implies T=1.33,
  # and the per-benchmark accuracy spread (0.66 to 0.85) brackets it to 1.8ish
  # before the hardest benchmark takes over.
  #
  # Discrete, like the other GPFA parameters and for the same reason: drawn from
  # a continuous range every soft trial is its own cache key and pays for a
  # full latent fit, and at this scale that is most of the trial budget.
  #
  # The range extends past what calibration implies because the data asked it
  # to: across 42 trials every one of the top ten sat at 1.8, which was the
  # largest value on offer, so the optimum was outside the grid rather than in
  # it. 3.4 is the top of the bracket the per-benchmark accuracy spread allows.
  latents.obs_temperature:
    values: [1.0, 1.33, 1.8, 2.5, 3.4]

  # --- latent-GP factor model ---
  # fast_tau is the one axis that has settled inside its range: 20 took five of
  # the top ten and 10, 40 and 80 all appear, so it is left alone.
  #
  # n_fast is unsettled. 1, 2 and 3 are indistinguishable on the current data
  # and only 6 is clearly worse, so the range stays wide rather than narrowing
  # toward the floor; n_fast=0 is not on it because it freezes the latent and
  # takes rho to 0.03. A bayes search allocates trials endogenously, so its
  # marginals here are not clean -- settle the axis with a paired rerun.
  #
  # The objective cannot compare across n_fast on its own: pooled rho weights a
  # dimension by its share of displacement variance, so motion concentrated in
  # one axis is scored on a different problem. ceiling_gain_per_dim removes the
  # weighting but collapses onto the pooled value when only one axis moves, so
  # read spurious_drift_ratio and baseline_mse beside both.
  #
  # fast_kind decides whether a drifting dimension is confined. Both kinds are
  # rough and their tau means the same thing, so the pair isolates confinement.
  # On the GPFA's own held-out blocks a homogeneous OU at tau=80 took the best
  # forecast RPS and log score of nine priors tried, beating the Wiener at every
  # matched tau, so it is on the menu here rather than assumed.
  #
  # n_fast=6 is >= every n_dims offered, which is how a homogeneous mix is
  # reached: the winning prior was homogeneous, and a per-dimension mix cannot
  # express it.
  n_dims:
    values: [3, 4, 5, 6]
  latents.n_fast:
    values: [1, 2, 3, 4, 6]
  latents.fast_kind:
    values: [wiener, ou]
  latents.fast_tau:
    values: [10.0, 20.0, 40.0, 80.0]
  # Confining the slow dimensions turned out to matter more than whether they
  # drift at all: holding a 1fast+5slow mix fixed and changing only the slow
  # kind, const -> wiener -> ou took forecast RPS 0.2830 -> 0.2822 -> 0.2734.
  #
  # slow_tau has to come with it. An OU reverts over 2*tau, so at 2560 alone it
  # would not revert once inside the span of the data and the option would be a
  # null test; 640 is where the gain above was measured.
  latents.slow_kind:
    values: [const, wiener, ou]
  latents.slow_tau:
    values: [640.0, 2560.0]
  # 8 was the largest value on offer and won monotonically over the smaller ones,
  # so 16 is here to find out whether that trend continues or the objective is
  # simply rewarding a coarser grid. Treat a win at 16 with suspicion: the grid
  # spacing is 2 * bin_factor days, so at 16 it cannot resolve the short fast_tau
  # values that the same trials prefer. The values below 8 are dropped: each
  # multiplies the cells and none has ever placed, so they were most of a budget
  # for the least of the evidence.
  latents.bin_factor:
    values: [8, 16]
  # Prior precision on the loadings. A paired rerun at one configuration put
  # 90d val_out ceiling_gain at 0.0975 off, 0.0857 at 10 and 0.0362 at 100 --
  # but sigma, learning_rate and confinement_factor had been selected against
  # the unregularised geometry, so that comparison holds the landscape fixed
  # while changing what it is fitted to. Here the search retunes them per
  # value, which is the test the paired rerun could not be. 1.0 covers the gap
  # below the smallest value measured, where a prior might buy a readable
  # table for little skill.
  #
  # dim_quality/* is the other half of this axis: it is logged and not
  # optimised, so the sweep still selects on forecast skill and the trade-off
  # is read off afterwards. rank_by_volume is deliberately not an axis -- it
  # reorders the table and touches nothing the objective sees, so a bayes
  # search cannot learn anything from it. Every trial scores both rankings.
  latents.w_ridge:
    values: [0.0001, 1.0, 10.0, 100.0]

  # --- landscape model ---
  # sigma above ~0.7 and lr above ~0.02 drove the drift field to zero inside
  # one epoch in the first sweep; both ranges stop short of that.
  sigma:
    distribution: log_uniform_values
    min: 0.02
    max: 0.4
  confinement_factor:
    distribution: log_uniform_values
    min: 1e-4
    max: 1e-1
  learning_rate:
    distribution: log_uniform_values
    min: 1e-4
    max: 1e-2
  weight_decay:
    distribution: log_uniform_values
    min: 1e-4
    max: 1e-1
  phi_layer_dropout:
    distribution: uniform
    min: 0.0
    max: 0.2
  phi_hidden_dims:
    values: ["[64,64,64]", "[128,128,128,128]", "[256,256,256]"]
  batch_size:
    values: [256, 512, 1024]
